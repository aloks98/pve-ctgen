# pvectgen Minion configuration
# Default location: /etc/pvectgen/minion.yaml

# gRPC listen address
listen_address: "0.0.0.0:50051"

# Node name — auto-detected from Proxmox hostname if left empty (recommended)
node_name: ""

# API key for authentication (auto-generated on first run if empty)
api_key: ""

# Path where cloud images are downloaded
iso_path: "/var/lib/vz/template/iso"

# Path where cloud-init snippets are stored
snippets_path: "/var/lib/vz/snippets"

# Temporary working directory for builds
work_dir: "/tmp/pvectgen"

# Durable job journals survive minion restarts.
jobs_dir: "/var/lib/pvectgen/jobs"

# Empty TLS paths provision a self-signed identity beside this configuration.
# Enrollment pins its SHA-256 fingerprint. Custom certificate/key paths must be absolute.
tls_cert: ""
tls_key: ""

# Select a node profile by default, by template.profile, or with build --profile.
default_profile: default
profiles:
  default:
    storage: local-lvm
    snippet_storage: local
    snippets_path: /var/lib/vz/snippets
    bridge: vmbr0
    disk_size: 32G
    disk_format: raw
    # Add your public keys here; defaults ship with locked passwords and no keys.
    # Keys go to admin for cloud-init and core for Ignition.
    ssh_authorized_keys: []
    timezone: UTC
    # Optional, for Debian/Ubuntu guests only:
    apt_proxy: ""
