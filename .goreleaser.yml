version: 2

project_name: pvectgen

before:
  hooks:
    - go mod tidy

builds:
  - id: pvectgen
    main: ./cmd/pvectgen
    binary: pvectgen
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}

archives:
  - id: default
    formats: ['tar.gz']
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - configs/*
      - cloudinit/*
      - config/*
      - scripts/install-minion.sh
      - LICENSE*
      - README*

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^ci:"

release:
  github:
    owner: aloks98
    name: pve-ctgen
  # Don't create the release — it already exists (created via GitHub UI).
  # GoReleaser just uploads the artifacts to it.
  mode: keep-existing
  extra_files:
    - glob: scripts/install-minion.sh
