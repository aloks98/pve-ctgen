#cloud-config
hostname: debian
preserve_hostname: false
manage_etc_hosts: true
package_upgrade: true
timezone: Asia/Kolkata

ssh_deletekeys: true
ssh_genkeytypes:
  - rsa
  - ecdsa
  - ed25519

# APT proxy config
apt:
  proxy: http://192.168.150.1:3142
  https_proxy: http://192.168.150.1:3142

# Users
users:
  - name: root
    lock_passwd: false
    shell: /usr/bin/fish
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFzsZwR43Gm8vUkx9s3aJl3mcmCJ8tl5x0S+GazG0iDV aloksahoo@mac
      - ssh-rsa  root@tokyo
      - ssh-rsa  root@osaka
      - ssh-rsa  root@kyoto
  - name: aloks98
    gecos: Alok Sahoo
    groups: sudo, docker
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /usr/bin/fish
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFzsZwR43Gm8vUkx9s3aJl3mcmCJ8tl5x0S+GazG0iDV aloksahoo@mac
      - ssh-rsa  root@tokyo
      - ssh-rsa  root@osaka
      - ssh-rsa  root@kyoto

# Password
chpasswd:
  expire: false
  list: |
    root:$6$wjysdlWLd696fDE3$1C2wRX2FMU1gOZrO7Yc.YkIjWbQCVaU1IwyFGPJDOSZSUJ4rvF.013M060MTYkGc9MTw4fmtrB3lyKspzOi5p/
    aloks98:$6$wjysdlWLd696fDE3$1C2wRX2FMU1gOZrO7Yc.YkIjWbQCVaU1IwyFGPJDOSZSUJ4rvF.013M060MTYkGc9MTw4fmtrB3lyKspzOi5p/

groups:
  - docker

# Packages
packages:
  - qemu-guest-agent
  - ca-certificates
  - curl
  - gnupg
  - lsb-release
  - locales
  - fish
  - htop
  - btop
  - vim
  - tmux
  - jq
  - tree
  - unzip
  - build-essential
  - procps
  - file
  - git
  - figlet
  - lolcat
  - fortune-mod
  - cowsay

# Files
write_files:
  - path: /etc/fish/conf.d/custom.fish
    permissions: "0644"
    content: |
      # Aliases
      alias ..='cd ..'
      alias ...='cd ../..'
      alias ll='ls -lAhF --color=auto'
      alias la='ls -A --color=auto'
      alias l='ls -CF --color=auto'
      alias gs='git status'
      alias gl='git log --oneline -20'
      alias gd='git diff'
      alias gp='git pull'
      alias dc='docker compose'
      alias dps='docker ps'
      alias dpsa='docker ps -a'
      alias dlogs='docker logs -f'
      alias dex='docker exec -it'
      alias ports='ss -tulnp'
      alias myip='hostname -I | awk "{print $1}"'

      # MOTD on login
      if status is-interactive
          bash /etc/profile.d/motd.sh
      end

  - path: /etc/profile.d/motd.sh
    permissions: "0755"
    content: |
      #!/bin/sh
      # Called explicitly from fish config
      printf '\033[1;34m'
      if [ -x /usr/bin/figlet ] && [ -x /usr/bin/lolcat ]; then
        /usr/bin/figlet -f standard "e412.in" | /usr/bin/lolcat
      else
        echo '      _  _   _ ____    _'
        echo '  ___| || | / |___ \  (_)_ __'
        echo ' / _ \ || |_| | __) | | | '"'"'_ \'
        echo '|  __/__   _| |/ __/ _| | | | |'
        echo ' \___|  |_| |_|_____(_)_|_| |_|'
      fi
      printf '\033[1;32m'
      echo "Welcome to $(hostname)!"
      echo "OS: $(cat /etc/debian_version)"
      echo "Kernel: $(uname -r)"
      echo "CPU: $(lscpu | grep 'Model name' | cut -f 2 -d ':' | sed 's/^[ \t]*//')"
      echo "Memory: $(free -h | grep Mem | awk '{print $2}')"
      echo "IP: $(hostname -I | awk '{print $1}')"
      if command -v docker >/dev/null 2>&1; then
        echo "Docker: $(docker --version 2>/dev/null | cut -d' ' -f3 | tr -d ',')"
        echo "Containers: $(docker ps -q 2>/dev/null | wc -l) running / $(docker ps -aq 2>/dev/null | wc -l) total"
      fi
      echo "Uptime: $(uptime -p)"
      echo "Disk: $(df -h / | awk 'NR==2 {print $3 "/" $2 " (" $5 " used)"}')"
      printf '\033[1;36m'
      echo "Random Quote of the Day:"
      if [ -x /usr/games/fortune ] && [ -x /usr/games/cowsay ]; then
        /usr/games/fortune | /usr/games/cowsay -f $(ls /usr/share/cowsay/cows/ | shuf -n1)
      else
        echo "Today's quote: Life is what happens while you're busy making other plans."
      fi
      printf '\033[0m'

  - path: /etc/ssh/sshd_config.d/hardening.conf
    permissions: "0644"
    content: |
      PasswordAuthentication no
      ChallengeResponseAuthentication no
      PubkeyAuthentication yes
      PermitRootLogin prohibit-password
      MaxAuthTries 3
      ClientAliveInterval 300
      ClientAliveCountMax 2

  - path: /etc/cron.weekly/system-cleanup
    permissions: "0755"
    content: |
      #!/bin/sh
      apt-get autoremove -y -qq
      apt-get autoclean -y -qq
      command -v docker >/dev/null 2>&1 && docker system prune -f --volumes 2>/dev/null || true
      journalctl --vacuum-time=7d 2>/dev/null || true

  - path: /etc/ssh/sshd_config.d/no-accept-locale.conf
    permissions: "0644"
    content: |
      AcceptEnv LANG LC_CTYPE LC_NUMERIC LC_TIME LC_COLLATE LC_MONETARY LC_MESSAGES LC_PAPER LC_NAME LC_ADDRESS LC_TELEPHONE LC_MEASUREMENT LC_IDENTIFICATION

# Commands
runcmd:
  - chsh -s /usr/bin/fish root
  - curl -fsSL https://raw.githubusercontent.com/oh-my-fish/oh-my-fish/master/bin/install -o /tmp/omf-install.fish
  - fish /tmp/omf-install.fish --noninteractive --yes
  - sudo -u aloks98 fish /tmp/omf-install.fish --noninteractive --yes
  - rm -f /tmp/omf-install.fish
  - sed -i 's/^# *en_US.UTF-8 UTF-8/en_US.UTF-8 UTF-8/' /etc/locale.gen
  - sed -i 's/^# *en_IN.UTF-8 UTF-8/en_IN.UTF-8 UTF-8/' /etc/locale.gen
  - locale-gen
  - update-locale LANG=en_US.UTF-8 LC_ALL=en_US.UTF-8
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/debian/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - systemctl enable --now docker
  - usermod -aG docker root
  - usermod -aG docker aloks98
  - systemctl enable --now qemu-guest-agent || true
  - chown -R aloks98:aloks98 /home/aloks98
  - sed -i 's/^#\?PrintMotd.*/PrintMotd yes/' /etc/ssh/sshd_config
  - sed -i 's/^session.*pam_motd.so.*$/#&/' /etc/pam.d/sshd
  - rm -f /etc/update-motd.d/*
  - rm -f /etc/motd
  - touch /etc/motd
  - chmod 644 /etc/motd
  - systemctl restart sshd

final_message: Cloud-init completed in $UPTIME seconds
