#cloud-config
preserve_hostname: false
manage_etc_hosts: true
package_upgrade: true
timezone: UTC

ssh_deletekeys: true
ssh_genkeytypes:
  - rsa
  - ecdsa
  - ed25519

# Users
users:
  - name: root
    lock_passwd: true
    shell: /usr/bin/fish
  - name: admin
    lock_passwd: true
    gecos: Administrator
    groups: wheel, docker
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /usr/bin/fish
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPuoDofo5+qGtLAHzvsvjZKdK6N+kmi4qI3JSwOqTt2p aloks98@titanair.local
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINbY4fAHtL2YnQji5aqrjpTCcmC9b0s0BtJebPjAEVIJ aloks98@fatman

ssh_pwauth: false
disable_root: true

groups:
  - docker

# Packages
packages:
  - epel-release
  - qemu-guest-agent
  - dnf-plugins-core
  - util-linux-user
  - glibc-langpack-en
  - fish
  - htop
  - vim-enhanced
  - tmux
  - jq
  - tree
  - unzip
  - procps-ng
  - file
  - git
  - figlet
  - cowsay

# Files
write_files:
  - path: /etc/fish/conf.d/custom.fish
    permissions: "0644"
    content: |
      # Aliases
      alias ..='cd ..'
      alias ...='cd ../..'
      alias ll='ls -lAhF --color=auto'
      alias la='ls -A --color=auto'
      alias l='ls -CF --color=auto'
      alias gs='git status'
      alias gl='git log --oneline -20'
      alias gd='git diff'
      alias gp='git pull'
      alias dc='docker compose'
      alias dps='docker ps'
      alias dpsa='docker ps -a'
      alias dlogs='docker logs -f'
      alias dex='docker exec -it'
      alias ports='ss -tulnp'
      alias myip='hostname -I | awk "{print $1}"'

      # MOTD on login
      if status is-interactive
          bash /etc/profile.d/motd.sh
      end

  - path: /etc/profile.d/motd.sh
    permissions: "0755"
    content: |
      #!/bin/sh
      # Called explicitly from fish config
      printf '\033[1;34m'
      if [ -x /usr/bin/figlet ]; then
        /usr/bin/figlet -f standard "Welcome"
      else
        echo '      _  _   _ ____    _'
        echo '  ___| || | / |___ \  (_)_ __'
        echo ' / _ \ || |_| | __) | | | '"'"'_ \'
        echo '|  __/__   _| |/ __/ _| | | | |'
        echo ' \___|  |_| |_|_____(_)_|_| |_|'
      fi
      printf '\033[1;32m'
      echo "Welcome to $(hostname)!"
      echo "OS: $(cat /etc/almalinux-release 2>/dev/null || cat /etc/redhat-release)"
      echo "Kernel: $(uname -r)"
      echo "CPU: $(lscpu | grep 'Model name' | cut -f 2 -d ':' | sed 's/^[ \t]*//')"
      echo "Memory: $(free -h | grep Mem | awk '{print $2}')"
      echo "IP: $(hostname -I | awk '{print $1}')"
      if command -v docker >/dev/null 2>&1; then
        echo "Docker: $(docker --version 2>/dev/null | cut -d' ' -f3 | tr -d ',')"
        echo "Containers: $(docker ps -q 2>/dev/null | wc -l) running / $(docker ps -aq 2>/dev/null | wc -l) total"
      fi
      echo "Uptime: $(uptime -p)"
      echo "Disk: $(df -h / | awk 'NR==2 {print $3 "/" $2 " (" $5 " used)"}')"
      printf '\033[1;36m'
      echo "Random Quote of the Day:"
      if [ -x /usr/bin/fortune ] && [ -x /usr/bin/cowsay ]; then
        /usr/bin/fortune | /usr/bin/cowsay -f $(ls /usr/share/cowsay/cows/ | shuf -n1)
      else
        echo "Today's quote: Life is what happens while you're busy making other plans."
      fi
      printf '\033[0m'

  - path: /etc/ssh/sshd_config.d/hardening.conf
    permissions: "0644"
    content: |
      PasswordAuthentication no
      ChallengeResponseAuthentication no
      PubkeyAuthentication yes
      PermitRootLogin prohibit-password
      MaxAuthTries 3
      ClientAliveInterval 300
      ClientAliveCountMax 2

  - path: /etc/cron.weekly/system-cleanup
    permissions: "0755"
    content: |
      #!/bin/sh
      dnf autoremove -y -q
      journalctl --vacuum-time=7d 2>/dev/null || true

  - path: /etc/ssh/sshd_config.d/no-accept-locale.conf
    permissions: "0644"
    content: |
      AcceptEnv LANG LC_CTYPE LC_NUMERIC LC_TIME LC_COLLATE LC_MONETARY LC_MESSAGES LC_PAPER LC_NAME LC_ADDRESS LC_TELEPHONE LC_MEASUREMENT LC_IDENTIFICATION

# Commands
runcmd:
  - chsh -s /usr/bin/fish root
  - localectl set-locale LANG=en_US.UTF-8 LC_ALL=en_US.UTF-8
  - dnf config-manager --set-enabled crb || dnf config-manager --set-enabled powertools || true
  - dnf install -y rubygems ruby-devel gcc make || true
  - gem install lolcat 2>/dev/null || true
  - dnf config-manager --add-repo https://download.docker.com/linux/centos/docker-ce.repo
  - dnf -y install docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - systemctl enable --now docker
  - usermod -aG docker root
  - usermod -aG docker admin
  - systemctl enable --now qemu-guest-agent || true
  - chown -R admin:admin /home/admin
  - sed -i 's/^#\?PrintMotd.*/PrintMotd yes/' /etc/ssh/sshd_config
  - sed -i 's/^session.*pam_motd.so.*$/#&/' /etc/pam.d/sshd
  - rm -f /etc/update-motd.d/*
  - rm -f /etc/motd
  - touch /etc/motd
  - chmod 644 /etc/motd
  - systemctl restart sshd

final_message: Cloud-init completed in $UPTIME seconds
