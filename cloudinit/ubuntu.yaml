packages:
  - qemu-guest-agent
  - ca-certificates
  - curl
  - gnupg
  - lsb-release
  - software-properties-common
  - locales
  # Shell
  - zsh
  - zsh-autosuggestions
  - zsh-syntax-highlighting
  # Common tools
  - htop
  - vim
  - tmux
  - jq
  - tree
  - unzip
  # Homebrew dependencies
  - build-essential
  - procps
  - file
  - git
  # MOTD
  - figlet
  - lolcat
  - fortune-mod
  - cowsay

write_files:
  - path: /etc/zsh/zshrc.local
    permissions: "0644"
    content: |
      autoload -Uz compinit && compinit
      zstyle ':completion:*' menu select
      zstyle ':completion:*' matcher-list 'm:{a-zA-Z}={A-Za-z}'
      zstyle ':completion:*' list-colors "${(s.:.)LS_COLORS}"
      zstyle ':completion:*:descriptions' format '%F{yellow}── %d ──%f'
      zstyle ':completion:*' group-name ''
      HISTFILE=~/.zsh_history
      HISTSIZE=50000
      SAVEHIST=50000
      setopt SHARE_HISTORY HIST_IGNORE_ALL_DUPS HIST_REDUCE_BLANKS HIST_VERIFY INC_APPEND_HISTORY EXTENDED_HISTORY
      setopt AUTO_CD AUTO_PUSHD PUSHD_IGNORE_DUPS PUSHD_SILENT CORRECT INTERACTIVE_COMMENTS NO_BEEP
      bindkey -e
      bindkey '^[[A' history-search-backward
      bindkey '^[[B' history-search-forward
      bindkey '^[[H' beginning-of-line
      bindkey '^[[F' end-of-line
      bindkey '^[[3~' delete-char
      bindkey '^[^[[D' backward-word
      bindkey '^[^[[C' forward-word
      if [[ $EUID -eq 0 ]]; then
        PROMPT='%F{red}%n%f@%F{yellow}%m%f:%F{blue}%~%f# '
      else
        PROMPT='%F{green}%n%f@%F{yellow}%m%f:%F{blue}%~%f$ '
      fi
      RPROMPT='%F{242}%*%f'
      alias ..='cd ..' ...='cd ../..'
      alias ll='ls -lAhF --color=auto' la='ls -A --color=auto' l='ls -CF --color=auto'
      alias gs='git status' gl='git log --oneline -20' gd='git diff' gp='git pull'
      alias dc='docker compose'
      alias dps='docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"'
      alias dpsa='docker ps -a --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"'
      alias dlogs='docker logs -f' dex='docker exec -it'
      alias ports='ss -tulnp' df='df -hT' free='free -h'
      alias myip='hostname -I | awk "{print \$1}"' reload='source ~/.zshrc'
      alias rm='rm -i' cp='cp -i' mv='mv -i'
      [[ -f /usr/share/zsh-autosuggestions/zsh-autosuggestions.zsh ]] && source /usr/share/zsh-autosuggestions/zsh-autosuggestions.zsh
      [[ -f /usr/share/zsh-syntax-highlighting/zsh-syntax-highlighting.zsh ]] && source /usr/share/zsh-syntax-highlighting/zsh-syntax-highlighting.zsh
      [[ -d /home/linuxbrew/.linuxbrew ]] && eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"

  - path: /root/.zshrc
    permissions: "0644"
    owner: root:root
    content: |
      source /etc/zsh/zshrc.local

  - path: /home/aloks98/.zshrc
    permissions: "0644"
    owner: aloks98:aloks98
    content: |
      source /etc/zsh/zshrc.local

  - path: /etc/profile.d/motd.sh
    permissions: "0755"
    content: |
      #!/bin/sh
      case "$-" in *i*) ;; *) return ;; esac
      printf '\033[1;34m'
      if [ -x /usr/bin/figlet ] && [ -x /usr/bin/lolcat ]; then
        /usr/bin/figlet -f standard "e412.in" | /usr/bin/lolcat
      else
        echo '      _  _   _ ____    _'
        echo '  ___| || | / |___ \  (_)_ __'
        echo ' / _ \ || |_| | __) | | | '"'"'_ \'
        echo '|  __/__   _| |/ __/ _| | | | |'
        echo ' \___|  |_| |_|_____(_)_|_| |_|'
      fi
      printf '\033[1;32m'
      echo "Welcome to $(hostname)!"
      echo "OS: $(lsb_release -ds 2>/dev/null || cat /etc/os-release | grep PRETTY_NAME | cut -d= -f2 | tr -d '"')"
      echo "Kernel: $(uname -r)"
      echo "CPU: $(lscpu | grep 'Model name' | cut -f 2 -d ':' | sed 's/^[ \t]*//')"
      echo "Memory: $(free -h | grep Mem | awk '{print $2}')"
      echo "IP: $(hostname -I | awk '{print $1}')"
      if command -v docker >/dev/null 2>&1; then
        echo "Docker: $(docker --version 2>/dev/null | cut -d' ' -f3 | tr -d ',')"
        echo "Containers: $(docker ps -q 2>/dev/null | wc -l) running / $(docker ps -aq 2>/dev/null | wc -l) total"
      fi
      if [ -x /home/linuxbrew/.linuxbrew/bin/brew ]; then
        echo "Homebrew: $(/home/linuxbrew/.linuxbrew/bin/brew --version 2>/dev/null | head -1 | cut -d' ' -f2)"
      fi
      echo "Uptime: $(uptime -p)"
      echo "Disk: $(df -h / | awk 'NR==2 {print $3 "/" $2 " (" $5 " used)"}')"
      printf '\033[1;36m'
      echo "Random Quote of the Day:"
      if [ -x /usr/games/fortune ] && [ -x /usr/games/cowsay ]; then
        /usr/games/fortune | /usr/games/cowsay -f $(ls /usr/share/cowsay/cows/ | shuf -n1)
      else
        echo "Today's quote: Life is what happens while you're busy making other plans."
      fi
      printf '\033[0m'

  - path: /etc/ssh/sshd_config.d/hardening.conf
    permissions: "0644"
    content: |
      PasswordAuthentication no
      ChallengeResponseAuthentication no
      PubkeyAuthentication yes
      PermitRootLogin prohibit-password
      MaxAuthTries 3
      ClientAliveInterval 300
      ClientAliveCountMax 2

  - path: /etc/cron.weekly/system-cleanup
    permissions: "0755"
    content: |
      #!/bin/sh
      apt-get autoremove -y -qq
      apt-get autoclean -y -qq
      command -v docker >/dev/null 2>&1 && docker system prune -f --volumes 2>/dev/null || true
      journalctl --vacuum-time=7d 2>/dev/null || true

  - path: /etc/ssh/sshd_config.d/no-accept-locale.conf
    permissions: "0644"
    content: |
      AcceptEnv LANG LC_CTYPE LC_NUMERIC LC_TIME LC_COLLATE LC_MONETARY LC_MESSAGES LC_PAPER LC_NAME LC_ADDRESS LC_TELEPHONE LC_MEASUREMENT LC_IDENTIFICATION

runcmd:
  # Generate locales (en_US for system default, en_IN for SSH client compatibility)
  - sed -i 's/^# *en_US.UTF-8 UTF-8/en_US.UTF-8 UTF-8/' /etc/locale.gen
  - sed -i 's/^# *en_IN.UTF-8 UTF-8/en_IN.UTF-8 UTF-8/' /etc/locale.gen
  - locale-gen
  - update-locale LANG=en_US.UTF-8 LC_ALL=en_US.UTF-8

  # Install Docker
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - systemctl enable --now docker

  # Configure Docker permissions
  - usermod -aG docker root
  - usermod -aG docker aloks98

  # Configure system services
  - systemctl enable --now qemu-guest-agent || true

  # Fix ownership of aloks98 .zshrc
  - chown aloks98:aloks98 /home/aloks98/.zshrc

  # Install Homebrew for aloks98
  - sudo -u aloks98 bash -c 'NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"'
  - sudo -u aloks98 bash -c 'eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)" && brew analytics off'
  - sudo -u aloks98 bash -c 'eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)" && brew install lazydocker btop'

  # Lock password login for aloks98
  - passwd -l aloks98

  # Configure SSH MOTD
  - sed -i 's/^#\?PrintMotd.*/PrintMotd yes/' /etc/ssh/sshd_config
  - sed -i 's/^session.*pam_motd.so.*$/#&/' /etc/pam.d/sshd
  - rm -f /etc/update-motd.d/*
  - rm -f /etc/motd
  - touch /etc/motd
  - chmod 644 /etc/motd
  - systemctl restart sshd

final_message: "Cloud-init completed in $UPTIME seconds"