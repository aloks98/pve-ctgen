#cloud-config
preserve_hostname: false
manage_etc_hosts: true
package_upgrade: false
timezone: UTC

ssh_deletekeys: true
ssh_genkeytypes:
  - rsa
  - ecdsa
  - ed25519

# Users
users:
  - name: root
    lock_passwd: true
    shell: /usr/bin/fish
    ssh_authorized_keys:
      # BEGIN MANAGED SSH KEYS
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPuoDofo5+qGtLAHzvsvjZKdK6N+kmi4qI3JSwOqTt2p aloks98@titanair.local
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINbY4fAHtL2YnQji5aqrjpTCcmC9b0s0BtJebPjAEVIJ aloks98@fatman
      # END MANAGED SSH KEYS
  - name: admin
    lock_passwd: true
    gecos: Administrator
    groups: wheel
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /usr/bin/fish
    ssh_authorized_keys:
      # BEGIN MANAGED SSH KEYS
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPuoDofo5+qGtLAHzvsvjZKdK6N+kmi4qI3JSwOqTt2p aloks98@titanair.local
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINbY4fAHtL2YnQji5aqrjpTCcmC9b0s0BtJebPjAEVIJ aloks98@fatman
      # END MANAGED SSH KEYS

ssh_pwauth: false
disable_root: false

# Packages
packages:
  - qemu-guest-agent
  - dnf-plugins-core
  - glibc-langpack-en

# Files
write_files:
  # Run only when the selected node profile sets install_docker: true.
  - path: /usr/local/sbin/pvectgen-install-docker
    permissions: "0755"
    content: |
      #!/bin/sh
      set -eu
      dnf config-manager --add-repo https://download.docker.com/linux/centos/docker-ce.repo
      dnf -y install docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
      systemctl enable --now docker
      usermod -aG docker root
      usermod -aG docker admin

  # EPEL packages must be installed after CRB and EPEL are enabled.
  - path: /usr/local/sbin/pvectgen-setup-el
    permissions: "0755"
    content: |
      #!/bin/sh
      set -eu
      dnf config-manager --set-enabled crb
      dnf install -y epel-release
      dnf install -y util-linux-user fish htop vim-enhanced tmux jq tree unzip procps-ng file git figlet cowsay rubygems ruby-devel gcc make
      # Decorative enhancement: keep the MOTD usable if RubyGems is unavailable.
      gem install lolcat || echo "Optional lolcat install failed; using the plain MOTD banner" >&2

  - path: /etc/fish/conf.d/custom.fish
    permissions: "0644"
    content: |
      # Aliases
      alias ..='cd ..'
      alias ...='cd ../..'
      alias ll='ls -lAhF --color=auto'
      alias la='ls -A --color=auto'
      alias l='ls -CF --color=auto'
      alias gs='git status'
      alias gl='git log --oneline -20'
      alias gd='git diff'
      alias gp='git pull'
      alias dc='docker compose'
      alias dps='docker ps'
      alias dpsa='docker ps -a'
      alias dlogs='docker logs -f'
      alias dex='docker exec -it'
      alias ports='ss -tulnp'
      function myip
          hostname -I | string split -n " " | head -n 1
      end

      # MOTD on login
      if status is-interactive
          bash /etc/profile.d/motd.sh
      end

  - path: /etc/profile.d/motd.sh
    permissions: "0755"
    content: |
      #!/bin/sh
      # Called explicitly from fish config
      printf '\033[1;34m'
      if [ -x /usr/bin/figlet ]; then
        if command -v lolcat >/dev/null 2>&1; then
          /usr/bin/figlet -f standard "Welcome" | lolcat
        else
          /usr/bin/figlet -f standard "Welcome"
        fi
      else
        echo '      _  _   _ ____    _'
        echo '  ___| || | / |___ \  (_)_ __'
        echo ' / _ \ || |_| | __) | | | '"'"'_ \'
        echo '|  __/__   _| |/ __/ _| | | | |'
        echo ' \___|  |_| |_|_____(_)_|_| |_|'
      fi
      printf '\033[1;32m'
      echo "Welcome to $(hostname)!"
      echo "OS: $(cat /etc/rocky-release 2>/dev/null || cat /etc/redhat-release)"
      echo "Kernel: $(uname -r)"
      echo "CPU: $(lscpu | grep 'Model name' | cut -f 2 -d ':' | sed 's/^[ \t]*//')"
      echo "Memory: $(free -h | grep Mem | awk '{print $2}')"
      echo "IP: $(hostname -I | awk '{print $1}')"
      if command -v docker >/dev/null 2>&1; then
        echo "Docker: $(docker --version 2>/dev/null | cut -d' ' -f3 | tr -d ',')"
        echo "Containers: $(docker ps -q 2>/dev/null | wc -l) running / $(docker ps -aq 2>/dev/null | wc -l) total"
      fi
      echo "Uptime: $(uptime -p)"
      echo "Disk: $(df -h / | awk 'NR==2 {print $3 "/" $2 " (" $5 " used)"}')"
      printf '\033[1;36m'
      echo "Random Quote of the Day:"
      if [ -x /usr/bin/fortune ] && [ -x /usr/bin/cowsay ]; then
        /usr/bin/fortune | /usr/bin/cowsay -f $(ls /usr/share/cowsay/cows/ | shuf -n1)
      else
        echo "Today's quote: Life is what happens while you're busy making other plans."
      fi
      printf '\033[0m'

  - path: /etc/ssh/sshd_config.d/00-pvectgen-access.conf
    permissions: "0644"
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PubkeyAuthentication yes
      PermitRootLogin prohibit-password
      MaxAuthTries 3
      ClientAliveInterval 300
      ClientAliveCountMax 2

# Commands
runcmd:
  - set -eu
  - /usr/local/sbin/pvectgen-setup-el
  - chsh -s /usr/bin/fish root
  - localectl set-locale LANG=en_US.UTF-8
  - systemctl enable --now qemu-guest-agent || true
  - chown -R admin:admin /home/admin
  - sed -i 's/^#\?PrintMotd.*/PrintMotd yes/' /etc/ssh/sshd_config
  - sed -i 's/^session.*pam_motd.so.*$/#&/' /etc/pam.d/sshd
  - rm -f /etc/update-motd.d/* /etc/motd
  - touch /etc/motd && chmod 644 /etc/motd
  - systemctl restart sshd

final_message: Cloud-init completed in $UPTIME seconds
